[package]
name = "smaos-bbs-sys"
version = "0.1.0"
edition = "2021"
description = "SMAOS BLS12-381 BBS+ Vector Zero-Knowledge Proof Engine"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
