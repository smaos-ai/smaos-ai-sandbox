name: 🔏 Sigstore SLSA L3 Release Signer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-sign:
    name: 🔏 Build, Notarize & Sign Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Sigstore & Release Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sigstore cryptography

      - name: 🏗️ Package Sovereign Artifact Bundle
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='node_modules' --exclude='__pycache__' -czvf dist/smaos-core-${{ github.ref_name }}.tar.gz src/ tests/ bin/ pyproject.toml

      - name: 🔏 Cryptographic Keyless Signing via Sigstore
        run: |
          python -m sigstore sign dist/smaos-core-${{ github.ref_name }}.tar.gz

      - name: 🚀 Generate GitHub Release & Attach Cryptographic Attestations
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/smaos-core-${{ github.ref_name }}.tar.gz
            dist/smaos-core-${{ github.ref_name }}.tar.gz.sigstore.json
          generate_release_notes: true
          draft: false
          prerelease: false
