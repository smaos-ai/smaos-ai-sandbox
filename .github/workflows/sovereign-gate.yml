name: 🛡️ Sovereign Zero-Trust Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security-and-compliance:
    name: 🛡️ Security & Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Stage 1: Gitleaks Secret & Key Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Verification Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🛡️ Stage 2: Sovereign Zero-Trust Guard (Path & Content Inspector)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
            echo "Inspecting changed files against main:"
            echo "$CHANGED_FILES"
            if [ -n "$CHANGED_FILES" ]; then
              python3 scripts/sovereign_guard.py $CHANGED_FILES
            else
              python3 scripts/sovereign_guard.py
            fi
          else
            python3 scripts/sovereign_guard.py
          fi

      - name: 🧪 Stage 3: Pytest Verification Suite
        run: |
          pytest tests/ -v --tb=short
