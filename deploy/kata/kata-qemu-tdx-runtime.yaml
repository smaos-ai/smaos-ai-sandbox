apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu-tdx
  labels:
    confidential-computing: "intel-tdx"
    governance.smaos.ai/membrane: "hardware-enclave"
handler: kata-qemu-tdx
scheduling:
  nodeSelector:
    feature.node.kubernetes.io/cpu-cpuid.TDX: "true"
    topology.kubernetes.io/zone: "eu-west-1a"
overhead:
  podFixed:
    memory: "512Mi"
    cpu: "250m"
