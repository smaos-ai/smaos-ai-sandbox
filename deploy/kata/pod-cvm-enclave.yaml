apiVersion: v1
kind: Pod
metadata:
  name: smaos-cvm-governance-membrane
  namespace: smaos-system
  labels:
    app.kubernetes.io/name: smaos-membrane
    governance.smaos.ai/confidential-vm: "enforced"
  annotations:
    io.katacontainers.config.hypervisor.kernel_params: "tdx_guest.debug=0 console=hvc0"
    io.katacontainers.config.hypervisor.default_vcpus: "4"
    io.katacontainers.config.hypervisor.default_memory: "8192"
spec:
  runtimeClassName: kata-qemu-tdx
  restartPolicy: Never
  hostNetwork: false
  dnsPolicy: None
  containers:
    - name: smaos-core-engine
      image: ghcr.io/smaos-ai/smaos-ai-sandbox:v1.0.0-production
      imagePullPolicy: IfNotPresent
      command: ["python3", "run.py", "--scenario", "504_timeout", "--live-cvm"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "2"
          memory: "4Gi"
        requests:
          cpu: "1"
          memory: "2Gi"
      volumeMounts:
        - name: audit-output
          mountPath: /app/audit_out
        - name: dev-tdx
          mountPath: /dev/tdx_guest
  volumes:
    - name: audit-output
      emptyDir: {}
    - name: dev-tdx
      hostPath:
        path: /dev/tdx_guest
