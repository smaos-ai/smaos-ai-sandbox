version: '3.8'

services:
  smaos-governance-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: smaos-ai/sandbox:v1.1.0-production
    container_name: smaos_hardened_runtime
    ports:
      - "127.0.0.1:8765:8765"
    network_mode: "none" # Zero-egress air-gap isolation
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./audit_out:/app/audit_out:rw
