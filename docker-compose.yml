version: '3.8'
services:
  smaos-governance-node:
    image: smaos-ai/sandbox:v0.5.0
    container_name: smaos_hardened_runtime
    network_mode: "none" # Zero-egress air-gap isolation
    cap_drop:
      - ALL
    cap_add:
      - CAP_BPF # Required for eBPF XDP kernel driver attach
      - CAP_NET_ADMIN # Required for network interface socket hooks
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    volumes:
      - ./audit_out:/workspace/audit_out:rw
